; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wheel, receiver, shifter, pedals

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17

[esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3-Zero: ESP32-S3FH4R2, 4 MB flash + 2 MB OPI PSRAM
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv

; Use the ESP32-S3 native USB connector for upload and Serial monitoring.
build_flags =
    -D BOARD_HAS_PSRAM

monitor_speed = 115200
upload_protocol = esptool

[env:wheel]
extends = esp32-s3-zero
build_src_filter = +<wheel/> -<receiver/> -<shifter/> -<pedals/>
build_flags =
    ${esp32-s3-zero.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DEVICE_ROLE_WHEEL
lib_deps =
    fastled/FastLED @ ^3.10.3

[env:receiver]
extends = esp32-s3-zero
build_src_filter = +<receiver/> -<wheel/> -<shifter/> -<pedals/>
; The base board defaults to hardware CDC (USB_MODE=1). TinyUSB device mode
; is required to expose a composite CDC + HID gamepad.
build_unflags =
    -D ARDUINO_USB_MODE=1
build_flags =
    ${esp32-s3-zero.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DEVICE_ROLE_RECEIVER
lib_deps =
    fastled/FastLED @ ^3.10.3

[env:shifter]
extends = esp32-s3-zero
build_src_filter = +<shifter/> -<wheel/> -<receiver/> -<pedals/>
; TinyUSB device mode exposes a standards-based HID gamepad plus CDC serial
; diagnostics. No wireless, SimHub, or third-party libraries are used.
; On macOS, selecting the USB modem wildcard prevents PlatformIO from opening
; an unrelated Bluetooth/debug serial device when several ports are present.
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
build_unflags =
    -D ARDUINO_USB_MODE=1
build_flags =
    ${esp32-s3-zero.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D DEVICE_ROLE_SHIFTER

[env:pedals]
extends = esp32-s3-zero
build_src_filter = +<pedals/> -<wheel/> -<receiver/> -<shifter/>
; Standalone three-axis USB HID pedals with CDC serial diagnostics. The pedal
; potentiometers connect to 3.3 V, GND, and one ADC pin each.
monitor_port = /dev/cu.usbmodem*
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
build_unflags =
    -D ARDUINO_USB_MODE=1
build_flags =
    ${esp32-s3-zero.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D DEVICE_ROLE_PEDALS
