; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wheel, receiver

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17

[esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3-Zero: ESP32-S3FH4R2, 4 MB flash + 2 MB OPI PSRAM
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default.csv

; Use the ESP32-S3 native USB connector for upload and Serial monitoring.
build_flags =
    -D BOARD_HAS_PSRAM

monitor_speed = 115200
upload_protocol = esptool

[env:wheel]
extends = esp32-s3-zero
build_src_filter = +<wheel/> -<receiver/>
build_flags =
    ${esp32-s3-zero.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DEVICE_ROLE_WHEEL
lib_deps =
    fastled/FastLED @ ^3.10.3

[env:receiver]
extends = esp32-s3-zero
build_src_filter = +<receiver/> -<wheel/>
; The base board defaults to hardware CDC (USB_MODE=1). TinyUSB device mode
; is required to expose a composite CDC + HID gamepad.
build_unflags =
    -D ARDUINO_USB_MODE=1
build_flags =
    ${esp32-s3-zero.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D DEVICE_ROLE_RECEIVER
